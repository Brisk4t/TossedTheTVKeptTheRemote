name: Build and release firmware

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO and mklittlefs
        run: |
          pip install platformio
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          # Try downloading prebuilt mklittlefs for common linux architectures
          set -e
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64)
              url="https://github.com/earlephilhower/mklittlefs/releases/latest/download/mklittlefs-linux-amd64"
              ;;
            aarch64|arm64)
              url="https://github.com/earlephilhower/mklittlefs/releases/latest/download/mklittlefs-linux-arm64"
              ;;
            *)
              url=""
              ;;
          esac
          downloaded=0
          if [ -n "$url" ]; then
            if curl -fsSL "$url" -o /usr/local/bin/mklittlefs; then
              chmod +x /usr/local/bin/mklittlefs
              echo "Downloaded mklittlefs for $arch"
              downloaded=1
            fi
          fi
          if [ "$downloaded" -ne 1 ]; then
            echo "Prebuilt mklittlefs not found for $arch — falling back to build from source"
            sudo apt-get install -y build-essential git
            git clone --depth=1 https://github.com/earlephilhower/mklittlefs.git /tmp/mklittlefs
            cd /tmp/mklittlefs
            make
            sudo cp mklittlefs /usr/local/bin/
          fi

      - name: Build (unified)
        working-directory: firmware
        run: pio run -e pico -t buildunified

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_with_fs
          path: firmware/.pio/build/pico/*.uf2

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/.pio/build/pico/*.uf2
          generate_release_notes: true
