name: Build and release firmware

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO and mklittlefs
        run: |
          pip install platformio
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates python3
          set -e
            arch=$(uname -m)
            echo "Detecting mklittlefs asset for arch: $arch"
            sudo apt-get install -y jq
            asset_url=$(curl -s https://api.github.com/repos/earlephilhower/mklittlefs/releases/latest | jq -r --arg arch "$arch" '.assets[] | .browser_download_url as $u | select((.name|ascii_downcase|test("linux")) and ((.name|ascii_downcase|contains($arch)) or ($arch=="x86_64" and (.name|ascii_downcase|contains("x86_64") or .name|ascii_downcase|contains("amd64"))) or ($arch=="aarch64" and (.name|ascii_downcase|contains("aarch64") or .name|ascii_downcase|contains("arm64"))))) | $u' | head -n1)
            url="$asset_url"
          if [ -n "$url" ]; then
            echo "Found download URL: $url"
            if curl -fsSL "$url" -o /usr/local/bin/mklittlefs; then
              chmod +x /usr/local/bin/mklittlefs
              echo "Downloaded mklittlefs"
            else
              echo "Download failed, will build from source"
              url=
            fi
          fi
          if [ -z "$url" ]; then
            echo "Building mklittlefs from source"
            sudo apt-get install -y build-essential git
            git clone --depth=1 --recurse-submodules https://github.com/earlephilhower/mklittlefs.git /tmp/mklittlefs
            cd /tmp/mklittlefs
            make
            sudo cp mklittlefs /usr/local/bin/
          fi

      - name: Build (unified)
        working-directory: firmware
        run: pio run -e ${{ matrix.board }} -t buildunified

      - name: Rename firmware binaries
        working-directory: firmware/.pio/build/${{ matrix.board }}
        run: |
          mv firmware.uf2 firmware_${{ matrix.board }}.uf2
          mv firmware_with_fs.uf2 firmware_with_fs_${{ matrix.board }}.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.board }}
          path: firmware/.pio/build/${{ matrix.board }}/firmware_${{ matrix.board }}.uf2

      - name: Upload firmware+filesystem artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware_with_fs_${{ matrix.board }}
          path: firmware/.pio/build/${{ matrix.board }}/firmware_with_fs_${{ matrix.board }}.uf2

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware_*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.uf2
          generate_release_notes: true
